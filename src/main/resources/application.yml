spring:
  application:
    name: monitor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/monitor}
    username: ${DB_USERNAME:monitor}
    password: ${DB_PASSWORD:monitor}
    hikari:
      # Fail fast when the DB is unreachable instead of Hikari's 30s default, so request threads don't pile up
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  # Actuator (probes, prometheus) on its own port so only the API port needs to be published/exposed publicly
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
      group:
        # Readiness includes the DB (stop routing traffic while it's down); liveness deliberately
        # doesn't, since restarting the app can't fix the DB and would only cause restart loops
        readiness:
          include: readinessState, db

monitor:
  # Used only until M/S are set via the API; persisted values always win afterwards
  defaults:
    m: ${MONITOR_DEFAULT_M:0}
    s: ${MONITOR_DEFAULT_S:0}
  # Invariant, checked at startup (AggregationProperties): lock-at-least-for <= lock-at-most-for < interval between cron slots
  aggregation:
    cron: ${MONITOR_AGGREGATION_CRON:0,30 * * * * *}
    lock-at-least-for: ${MONITOR_LOCK_AT_LEAST_FOR:PT20S}
    lock-at-most-for: ${MONITOR_LOCK_AT_MOST_FOR:PT29S}
  scheduling:
    enabled: ${MONITOR_SCHEDULING_ENABLED:true}
