apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
spec:
  # Several instances share the database; ShedLock makes aggregation run once per slot across them (ADR-004)
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: monitor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitor
      annotations:
        # For Prometheus setups that discover pods by annotation; with the Prometheus Operator use a
        # ServiceMonitor on the monitor-management Service instead
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /actuator/prometheus
    spec:
      automountServiceAccountToken: false
      # Otherwise every Service in the namespace becomes MONITOR_*/POSTGRES_* env vars in the container
      enableServiceLinks: false
      # preStop sleep (5s) + Spring's graceful shutdown (30s by default) + margin
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: monitor
      containers:
        - name: monitor
          image: monitor
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: monitor
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: monitor-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monitor-db
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            # Heap is 75% of this (-XX:MaxRAMPercentage=75 in the image). No CPU limit, to avoid throttling
            limits:
              memory: 512Mi
          # Gives the JVM up to 120s to start before liveness applies
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 24
          # Liveness excludes the DB: restarting can't fix it (ADR-006)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # With the DB down, readiness answers 503 after DB_CONNECTION_TIMEOUT_MS (5s), so the timeout must be longer
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
            timeoutSeconds: 7
            failureThreshold: 2
          lifecycle:
            # Keeps serving while the endpoint removal reaches the Services and load balancers
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Tomcat's work directory and the JVM's perf data; the rest of the filesystem is read-only
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
