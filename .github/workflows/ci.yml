name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to the same PR cancels the previous run; runs on master always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Same database the integration tests expect locally (src/test/resources/application-test.yml)
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: monitor_test
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --wait blocks until every service is healthy, which exercises the image's HEALTHCHECK (readiness)
      - name: Build the image and start Postgres + the service
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Smoke test the API
        run: |
          curl --fail-with-body -sS localhost:9090/actuator/health/readiness
          echo
          status=$(curl -sS -o /dev/null -w '%{http_code}' localhost:8080/actuator/health)
          echo "actuator on the API port -> $status"
          test "$status" = 404
          curl --fail-with-body -sS -X PATCH localhost:8080/api/v1/config \
            -H 'Content-Type: application/json' -d '{"m":25,"s":34}'
          echo
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/v1/monitor/data \
            -H 'Content-Type: application/json' \
            -d '{"sensorId":"ci","data":1.5,"timestamp":"2026-01-01T00:00:00"}')
          echo "POST /api/v1/monitor/data -> $status"
          test "$status" = 202

      - name: Show service logs
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
