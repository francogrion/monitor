version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml current (Dependabot updates the SHA and the version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly

  # No "docker" ecosystem on purpose: the Dockerfile's floating tags (25-jre, 3.9-eclipse-temurin-25) already
  # pick up patch releases on every rebuild, so Dependabot would only propose JDK major changes, which are
  # deliberate decisions (see ADR-010 in ARCHITECTURE.md).
