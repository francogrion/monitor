version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml current (Dependabot updates the SHA and the version comment)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly

  # Base images in the Dockerfile (maven, eclipse-temurin)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
